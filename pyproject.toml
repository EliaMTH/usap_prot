[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usap"
version = "0.4.0"
description = "Urban Semantic Annotation Package phase-1 prototype"
requires-python = ">=3.11"
dependencies = [
    "laspy>=2.5",
    "lxml>=5",
    "trimesh>=4",
    "numpy>=1.26",
    "pyroaring>=1.0"
]

# Plain `laspy` reads LAS but not LAZ, and parses no CRS: both need a backend
# of their own. Kept optional so a mesh-only install stays small, but a missing
# backend is reported as a missing capability, never as "this file has no CRS"
# (see adapters/las_adapter.py).
[project.optional-dependencies]
laz = ["laspy[lazrs]>=2.5"]
crs = ["pyproj>=3.6"]

# The built-in ontology reader is RDF/XML only, parsed with the lxml USAP
# already depends on. Turtle and the other RDF syntaxes need a real RDF
# parser; kept optional so an RDF/XML-only install stays small, and a missing
# parser is reported as a missing capability, never as "this file is broken"
# (see domain_vocab._read_ontology_rdflib).
ttl = ["rdflib>=7"]

[tool.setuptools.packages.find]
where = ["src"]

# The schema and the example vocabularies are runtime data: USAPPackage.create
# and seed_default_ade_vocabulary read them by default, so they must ship in
# the wheel, not just in a checkout.
#
# CityGML concepts are deliberately NOT here. They are read from the OGC XSDs
# or an ontology the caller supplies (load_citygml_schema / load_ontology), so
# USAP ships no assertion of its own about what CityGML contains.
[tool.setuptools.package-data]
usap = ["data/schema.sql", "data/vocabularies/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]